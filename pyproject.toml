[project]
name = "fusion-equilibrium-challenge"
version = "0.1.0"
description = "Starter kit for the Fusion Equilibrium Challenge (NeurIPS hackathon)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scikit-image>=0.22",
    "datasets>=2.14",
    "plotly>=5.18",
    "tensorboard (>=2.21.0,<3.0.0)",
    "cursor-sdk>=1.0.28",
    "tqdm>=4.66",
]

[tool.poetry]
package-mode = false

# Torch is installed from the CUDA 13.2 index by
# catskills/scripts/bootstrap_py314_torch.sh (Poetry cannot resolve +cu132).
[tool.poetry.group.pytorch]
optional = true

[tool.poetry.group.pytorch.dependencies]
torch = ">=2.13,<2.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
